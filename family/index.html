<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>成长工具箱 · 家庭激励系统 v2</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --cream:#FFF8F0;--ink:#3E3328;--sub:#9C9083;--line:#F0E7DB;
  --red:#F4635E;--orange:#FF9F43;--yellow:#FFC93C;--green:#6BCB77;
  --blue:#4D96FF;--purple:#9D7CE8;--pink:#FF8FB1;--brown:#B08968;--gray:#B4B2A9;
}
html,body{margin:0;padding:0}
body{
  background:var(--cream);
  background-image:
    radial-gradient(circle at 20px 20px,rgba(255,159,67,.07) 2px,transparent 2px),
    radial-gradient(circle at 60px 60px,rgba(77,150,255,.07) 2px,transparent 2px);
  background-size:80px 80px;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
  color:var(--ink);font-size:14px;line-height:1.5;
}
.wrap{max-width:780px;margin:0 auto;padding:14px 14px 96px}
.row{display:flex;align-items:center}
.col{display:flex;flex-direction:column}
.between{justify-content:space-between}
.center{justify-content:center;text-align:center}
.wrapf{flex-wrap:wrap}
.fill{flex:1;min-width:0}
.tr{text-align:right}.tc{text-align:center}
.g4{gap:4px}.g6{gap:6px}.g8{gap:8px}.g10{gap:10px}.g12{gap:12px}
.mt4{margin-top:4px}.mt6{margin-top:6px}.mt8{margin-top:8px}.mt10{margin-top:10px}
.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}.mt24{margin-top:24px}
.mb2{margin-bottom:2px}.mb4{margin-bottom:4px}.mb6{margin-bottom:6px}.mb8{margin-bottom:8px}
.mb10{margin-bottom:10px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}
.xs{font-size:11px}.sm{font-size:13px}.nm{font-size:14px}.lg{font-size:16px}
.xl{font-size:20px}.xxl{font-size:26px}.huge{font-size:34px}
.mut{color:var(--sub)}.bd{font-weight:700}.xb{font-weight:900}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hide{display:none!important}
.card{background:#fff;border-radius:18px;box-shadow:0 3px 0 rgba(180,160,140,.16),0 1px 3px rgba(0,0,0,.04)}
.pad{padding:14px}.padl{padding:16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media(max-width:560px){.grid3,.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;border:0;border-radius:12px;
  padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer;transition:transform .08s;font-family:inherit;color:var(--ink);background:#F3EDE4}
.btn:active{transform:translateY(2px)}
.btn.pri{background:var(--orange);color:#fff}
.btn.ok{background:var(--green);color:#fff}
.btn.bl{background:var(--blue);color:#fff}
.btn.pk{background:var(--pink);color:#fff}
.btn.dk{background:var(--ink);color:var(--cream)}
.btn.gh{background:#F3EDE4;color:#8B7F72}
.btn.wide{width:100%}
.btn.tiny{padding:5px 9px;font-size:11px;border-radius:9px}
.btn:disabled{opacity:.4;cursor:not-allowed}
input,select,textarea{font-family:inherit;font-size:14px;padding:9px 11px;border:1.5px solid var(--line);
  border-radius:10px;background:#fff;color:var(--ink);width:100%;outline:none;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--orange)}
label.fl{font-size:11px;color:var(--sub);display:block;margin-bottom:4px}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#B4B2A9 50%),linear-gradient(135deg,#B4B2A9 50%,transparent 50%);
  background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:28px}
.tabs{display:flex;gap:5px;background:#fff;border-radius:16px;padding:5px;box-shadow:0 3px 0 rgba(180,160,140,.16)}
.tabs button{flex:1;border:0;background:transparent;border-radius:12px;padding:9px 3px;font-size:12px;font-weight:700;
  color:var(--sub);cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap}
.tabs button.on{background:var(--ink);color:#FFF8F0}
.bead{width:13px;height:13px;border-radius:4px;flex:0 0 auto;
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.13),inset 0 2px 0 rgba(255,255,255,.5)}
.hbar{height:10px;border-radius:6px;background:#F3EDE4;overflow:hidden}
.hbar>i{display:block;height:100%;border-radius:6px;transition:width .4s}
.dash{border:1.5px dashed #E8DCCB;border-radius:14px;background:transparent}
.list{border-radius:14px;background:#FAF6F0;padding:9px 11px}
.chip{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;background:#F3EDE4;color:#8B7F72}
.pill{padding:7px 14px;border-radius:20px;font-size:13px;font-weight:700;border:0;cursor:pointer;font-family:inherit;
  background:#fff;color:var(--sub);box-shadow:0 2px 0 rgba(180,160,140,.16);white-space:nowrap}
.pill.on{color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.mask{position:fixed;inset:0;background:rgba(48,36,24,.4);display:flex;align-items:center;justify-content:center;
  padding:14px;z-index:900;overflow:auto}
.mask.bottom{align-items:flex-end}
.modal{background:#fff;border-radius:20px;padding:18px;width:100%;max-width:460px;max-height:88vh;overflow:auto;
  box-shadow:0 12px 40px rgba(60,44,28,.22)}
@keyframes pop{0%{transform:scale(.9);opacity:0}60%{transform:scale(1.03)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .26s cubic-bezier(.4,1.4,.6,1) both}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .3s}
#toastbox{position:fixed;top:16px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:999;pointer-events:none}
.toast{padding:10px 18px;border-radius:14px;color:#fff;font-size:13px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.18)}
#fly{position:fixed;z-index:999;font-weight:900;font-size:26px;color:var(--orange);text-shadow:0 2px 0 #fff;pointer-events:none}
table.tb{width:100%;border-collapse:collapse;font-size:12px}
table.tb th,table.tb td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
table.tb th{color:var(--sub);font-weight:700;font-size:11px}
.hm{display:grid;grid-template-columns:repeat(8,1fr);gap:3px}
.hm i{display:block;padding-bottom:100%;border-radius:3px;background:#F3EDE4}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:800;display:flex;gap:4px;max-width:780px;margin:0 auto;
  background:rgba(255,252,247,.97);border-top:1px solid var(--line);backdrop-filter:blur(10px);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.bnav button{flex:1;border:0;background:transparent;border-radius:14px;padding:6px 2px;cursor:pointer;
  font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;transition:.15s}
.bnav button .bi{font-size:19px;line-height:1;filter:grayscale(1) opacity(.5);transition:.15s}
.bnav button .bt{font-size:10px;font-weight:700;color:var(--sub)}
.bnav button.on{background:#FFF1E0}
.bnav button.on .bi{filter:none}
.bnav button.on .bt{color:var(--orange)}
#print-area{display:none}
@media print{
  body{background:#fff}
  body>*{display:none!important}
  #print-area{display:block!important}
  #print-area .sheet{page-break-after:always}
}
@media(max-width:520px){
  .wrap{padding:10px 10px 90px}
  .xxl{font-size:22px}.huge{font-size:28px}
}
</style>
</head>

function pad2(n){ n = String(n); return n.length < 2 ? '0' + n : n; }
function todayStr(){ var d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }
function dateStr(offset){
  var d = new Date(); d.setDate(d.getDate() + offset);
  return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
}
function monthStr(offset){
  var d = new Date(); d.setDate(1); d.setMonth(d.getMonth() + (offset||0));
  return d.getFullYear() + '-' + pad2(d.getMonth()+1);
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function $(s){ return document.querySelector(s); }
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];

}
function dateOffsetOf(ds){

var REJECT_REASONS = ['今天没有完成哦','质量还不够好，再认真一点','时长不够，明天加油','这个是爸妈陪着你做的，不算独立完成','下次可以做得更好'];
var PLEDGE_DEFAULT = '答应的事一定做到，不做交换条件';

/* ---------- 状态 ---------- */
var DB = null;
var UI = { view:'kid', kidTab:'today', parentTab:'audit', shopTier:'拼豆', parentUnlocked:false };
var TIER_PICK = {};

function freshDB(){
  return {
    version: 2,
    config: JSON.parse(JSON.stringify(CONFIG_DEFAULT)),
    tasks: JSON.parse(JSON.stringify(TASKS_DEFAULT)),
    rewards: JSON.parse(JSON.stringify(REWARDS_DEFAULT)),

      return { id:b.id, name:b.name, icon:b.icon, cond:b.cond, achievedAt:null };
    }),
    checkins: [], orders: [], ledger: [], wishes: [], pledges: [],
    account: {
      mainBalance:0, beadFund:0, freeWallet:0, dreamBalance:0,
      totalEarned:0, totalSpent:0, streakDays:0, integrityScore:0
    },

    meta: { createdAt: Date.now(), interestMonth: monthStr(0) }
  };
}

function loadDB(){
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if(!raw){ DB = freshDB(); saveDB(); return; }
    DB = JSON.parse(raw);
    var def = freshDB();
    if(!DB.config) DB.config = def.config;
    Object.keys(CONFIG_DEFAULT).forEach(function(k){
      if(DB.config[k] === undefined || DB.config[k] === null && k !== 'parentPin') DB.config[k] = CONFIG_DEFAULT[k];
    });
    if(!DB.tasks)   DB.tasks   = def.tasks;
    if(!DB.rewards) DB.rewards = def.rewards;
    if(!DB.badges){
      DB.badges = def.badges;
    } else {
      def.badges.forEach(function(b){
        if(!DB.badges.some(function(x){ return x.id === b.id; })) DB.badges.push(b);
      });
    }
    if(!DB.checkins) DB.checkins = [];
    if(!DB.orders)   DB.orders   = [];
    if(!DB.ledger)   DB.ledger   = [];
    if(!DB.wishes)   DB.wishes   = [];
    if(!DB.pledges)  DB.pledges  = [];
    if(!DB.flags)    DB.flags    = { moon:false, bead:false, interest:false };
    if(DB.flags.interest === undefined) DB.flags.interest = false;
    if(!DB.account)  DB.account  = def.account;
    if(DB.account.freeWallet === undefined) DB.account.freeWallet = 0;
    if(DB.account.beadFund === undefined)   DB.account.beadFund = 0;
    if(!DB.meta) DB.meta = { createdAt: Date.now(), interestMonth: monthStr(0) };
    if(!DB.meta.interestMonth) DB.meta.interestMonth = monthStr(0);
  } catch(e){
    console.error(e);
    DB = freshDB();
    saveDB();
  }
  settleInterest();
}
function saveDB(){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); }
  catch(e){ toast('保存失败：浏览器存储空间不足','err'); }
}

/* ---------- 账本与积分引擎 ---------- */
function ledger(type, points, desc, refId){
  DB.ledger.unshift({ id:uid(), date:todayStr(), ts:Date.now(), type:type, points:points, desc:desc, refId:refId || null });
  if(DB.ledger.length > 2000) DB.ledger.length = 2000;
}
function calcLevel(totalEarned){
  var idx = 0;
  LEVELS.forEach(function(lv,i){ if(totalEarned >= lv.min) idx = i; });
  return idx;
}
function levelProgress(){
  var idx = calcLevel(DB.account.totalEarned);
  var cur = LEVELS[idx], next = LEVELS[idx+1];
  if(!next) return { idx:idx, cur:cur, next:null, pct:100, need:0 };
  var span = next.min - cur.min;
  var done = DB.account.totalEarned - cur.min;
  return { idx:idx, cur:cur, next:next, pct:Math.min(100, Math.round(done / span * 100)), need:next.min - DB.account.totalEarned };
}
function creditPoints(points, desc, refId, opts){
  opts = opts || {};
  var savings = 0;
  if(opts.withSavings !== false) savings = Math.floor(points * DB.config.savingsRate);
  DB.account.mainBalance += (points - savings);
  DB.account.dreamBalance += savings;
  DB.account.totalEarned += points;
  ledger('earn', points, desc, refId);
  if(savings > 0) ledger('savings', -savings, '强制储蓄转入梦想账户（' + desc + '）', refId);
  checkBadges();
  checkWishes();
}
function debitPoints(points, desc, refId){
  DB.account.mainBalance -= points;
  DB.account.totalSpent += points;
  ledger('spend', -points, desc, refId);
}
function revokeCheckin(c){
  var pts = c.points;
  var savings = Math.floor(pts * DB.config.savingsRate);
  DB.account.mainBalance -= (pts - savings);
  DB.account.dreamBalance -= savings;
  DB.account.totalEarned -= pts;
  c.status = 'revoked';
  ledger('spend', -pts, '撤销（虚报）：' + c.taskName, c.id);
}

/* 月度利息结算：梦想账户月息（借鉴 Greenlight / FamZoo 的家长付息机制） */
function settleInterest(){
  if(!DB || !DB.config || !DB.meta) return;
  var rate = Number(DB.config.dreamInterestRate) || 0;
  var guard = 0;
  while(DB.meta.interestMonth < monthStr(0) && guard++ < 24){
    var next = DB.meta.interestMonth;
    var parts = next.split('-');
    var d = new Date(Number(parts[0]), Number(parts[1]), 1);
    DB.meta.interestMonth = d.getFullYear() + '-' + pad2(d.getMonth() + 1);
    if(rate > 0 && DB.account.dreamBalance > 0){
      var interest = Math.max(1, Math.round(DB.account.dreamBalance * rate));
      DB.account.dreamBalance += interest;
      ledger('bonus', interest, '梦想账户月息结算（' + rate * 100 + '%）', null);
      DB.flags.interest = true;
    }
  }
  saveDB();
}

/* ---------- 任务查询 ---------- */
function taskById(id){ return DB.tasks.filter(function(t){ return t.id === id; })[0]; }
function rewardById(id){ return DB.rewards.filter(function(r){ return r.id === id; })[0]; }
function activeTasks(){ return DB.tasks.filter(function(t){ return t.active !== false; }); }
function activeRewards(){ return DB.rewards.filter(function(r){ return r.active !== false; }); }
function effectiveAuditMode(t){ return t.trustLevel === 'audit' ? 'audit' : t.auditMode; }
function weekStart(){
  var d = new Date();
  var day = (d.getDay() + 6) % 7;
  var s = new Date(d); s.setDate(d.getDate() - day);
  return s.getFullYear() + '-' + pad2(s.getMonth()+1) + '-' + pad2(s.getDate());
}
function todayCheckins(){
  var t = todayStr();
  return DB.checkins.filter(function(c){ return c.date === t; });
}
function autoApprovedToday(){
  var t = todayStr();
  return DB.checkins.filter(function(c){ return c.date === t && c.status === 'auto_approved'; });
}
/* ---------- 频次与次数上限引擎 ----------
   规则来源：任务上的 freq / freqTimes / freqDays / noLimit
     daily   + freqTimes=1 → 一天一次（默认）
     daily   + freqTimes=2 → 一天最多两次
     weekly  + freqTimes=3 → 一周最多三次
     monthly + freqTimes=1 → 一月一次
     custom  + freqDays=3  → 每 3 天一次
     once                  → 这辈子只记一次
     noLimit               → 不限次数
   ============================================ */
function freqTimesOf(t){ var n = parseInt(t.freqTimes, 10); return (isNaN(n) || n < 1) ? 1 : n; }
function freqDaysOf(t){ var n = parseInt(t.freqDays, 10); return (isNaN(n) || n < 2) ? 2 : n; }
function freqWindowLabel(t){
  if(t.freq === 'weekly')  return '本周';
  if(t.freq === 'monthly') return '本月';
  if(t.freq === 'custom')  return '近' + freqDaysOf(t) + '天';
  return '今天';
}
function freqPeriodStart(t){
  if(t.freq === 'weekly')  return weekStart();
  if(t.freq === 'monthly') return monthStr(0) + '-01';
  if(t.freq === 'custom')  return dateStr(-(freqDaysOf(t) - 1));
  return todayStr();
}
function freqUsed(t){
  if(t.noLimit) return 0;
  var ok = function(c){ return c.taskId === t.id && c.status !== 'rejected' && c.status !== 'revoked'; };
  if(t.freq === 'once') return DB.checkins.filter(ok).length;
  var s = freqPeriodStart(t);
  return DB.checkins.filter(function(c){ return ok(c) && c.date >= s; }).length;
}
function freqMax(t){
  if(t.noLimit) return Infinity;
  if(t.freq === 'once' || t.freq === 'custom') return 1;
  return freqTimesOf(t);
}
function freqLeft(t){ return Math.max(0, freqMax(t) - freqUsed(t)); }
function freqDone(t){ return freqLeft(t) <= 0; }
function freqText(t){
  if(t.noLimit) return '不限次数';
  if(t.freq === 'once') return '只记一次';
  if(t.freq === 'custom') return '每 ' + freqDaysOf(t) + ' 天一次';
  var n = freqTimesOf(t), u = FREQ_UNIT[t.freq] || '天';
  return n > 1 ? '每' + u + n + '次' : '每' + u + '一次';
}
function dailyDone(task){ return freqDone(task); }
function updateStreak(){
  var days = DB.checkins
    .filter(function(c){ return c.status === 'approved' || c.status === 'auto_approved'; })
    .map(function(c){ return c.date; });
  days = days.filter(function(v,i,a){ return a.indexOf(v) === i; });
  if(!days.length){ DB.account.streakDays = 0; return; }
  var streak = 0;
  for(var i = 0; i < 400; i++){
    if(days.indexOf(dateStr(-i)) >= 0) streak++;
    else if(i > 0) break;
  }
  DB.account.streakDays = streak;
}
function pointsOn(ds){
  return DB.ledger.filter(function(l){ return l.date === ds && l.type === 'earn'; })
                  .reduce(function(s,l){ return s + l.points; }, 0);
}

/* ---------- 打卡 / 审核 ---------- */
function doCheckIn(task, tierLabel){
  if(freqLeft(task) <= 0){
    toast(task.freq === 'once' ? '这项已经完成过啦' : freqWindowLabel(task) + '的次数已经用完啦，下次再来',
      'warn');
    return;
  }
  var points = task.points;
  if(task.tiers && tierLabel != null){
    var t = task.tiers.filter(function(x){ return x.label === tierLabel; })[0];
    if(t) points = t.points;
  }
  var mode = effectiveAuditMode(task);
  var usedPts = autoApprovedToday().reduce(function(s,c){ return s + c.points; }, 0);
  var usedCnt = autoApprovedToday().length;
  var overLimit = (usedPts + points > DB.config.freeAuditDailyPoints) || (usedCnt >= DB.config.freeAuditDailyCount);
  var status = (mode === 'audit' || overLimit) ? 'pending' : 'auto_approved';

  var rec = {
    id: uid(), taskId: task.id, taskName: task.name, cat: task.cat,
    tierLabel: tierLabel || null, points: points,
    date: todayStr(), ts: Date.now(),
    status: status, note: '', spotCheckStatus:'none',
    approvedAt: status === 'auto_approved' ? Date.now() : null
  };
  DB.checkins.unshift(rec);

  if(status === 'auto_approved'){
    if(task.id === 't12') DB.flags.moon = true;
    updateStreak();
    creditPoints(points, task.name + (tierLabel ? '（' + tierLabel + '）' : ''), rec.id);
    saveDB();
    flyScore(points);
    toast('+' + points + ' 分！真棒','ok');
  } else {
    saveDB();
    if(overLimit && mode !== 'audit') toast('今天的免审额度用完了，剩下的要等爸妈确认哦','warn');
    else if(DB.config.spotCheckRate > 0 && Math.random() < 0.3) toast('已提交，等爸妈确认','info');
    else toast('已提交，等爸妈确认','info');
  }
  render();
}
function approveCheckIn(id, ok, note){
  var c = DB.checkins.filter(function(x){ return x.id === id; })[0];
  if(!c) return;
  if(ok){
    if(c.status === 'pending'){
      c.status = 'approved'; c.approvedAt = Date.now(); c.note = '';
      if(c.taskId === 't12') DB.flags.moon = true;
      updateStreak();
      creditPoints(c.points, c.taskName + (c.tierLabel ? '（' + c.tierLabel + '）' : ''), c.id);
    }
  } else {
    c.status = 'rejected'; c.note = note || '未通过';
  }
  saveDB(); render();
}
function batchApproveCheckins(ids){
  var just = [];
  ids.forEach(function(id){
    var c = DB.checkins.filter(function(x){ return x.id === id; })[0];
    if(c && c.status === 'pending'){
      c.status = 'approved'; c.approvedAt = Date.now(); c.note = '';
      if(c.taskId === 't12') DB.flags.moon = true;
      just.push(c);
    }
  });
  updateStreak();
  just.forEach(function(c){
    creditPoints(c.points, c.taskName + (c.tierLabel ? '（' + c.tierLabel + '）' : ''), c.id);
  });
  saveDB(); render();
  toast(just.length ? ('已通过 ' + just.length + ' 条') : '没有可处理的记录', just.length ? 'ok' : 'warn');
}
function rejectCheckin(id){
  var c = DB.checkins.filter(function(x){ return x.id === id; })[0];
  if(!c) return;
  var body = '<div class="mb8 sm mut">选择或输入退回原因，孩子端会看到这句话</div>' +
    '<div class="mb10" style="display:flex;flex-wrap:wrap;gap:6px">' +
    REJECT_REASONS.map(function(r){
      return '<button class="pill" onclick="this.parentNode.parentNode.querySelector(\'#rej-note\').value=this.textContent;this.parentNode.querySelectorAll(\'.pill\').forEach(function(b){b.classList.remove(\'on\')});this.classList.add(\'on\');this.style.background=\'#FF9F43\'" style="font-size:12px">' + esc(r) + '</button>';
    }).join('') + '</div>' +
    '<input id="rej-note" placeholder="退回原因" value="">' +
    '<div class="row g8 mt12"><button class="btn gh fill" onclick="closeModal()">取消</button>' +
    '<button class="btn pri fill" onclick="doReject(\'' + id + '\')">确认退回</button></div>';
  openModal('退回这条打卡', body);
  setTimeout(function(){ var el = $('#rej-note'); if(el) el.focus(); }, 60);
}
function doReject(id){
  var el = $('#rej-note');
  var note = el ? el.value.trim() : '';
  closeModal();
  approveCheckIn(id, false, note || '未通过');
  toast('已退回，孩子端可以看到原因','info');
}

/* ---------- 信任引擎 ---------- */
function spotCheck(id, result){
  var c = DB.checkins.filter(function(x){ return x.id === id; })[0];
  if(!c) return;
  c.spotCheckStatus = result;
  var task = taskById(c.taskId);
  if(result === 'verified'){
    DB.account.integrityScore += 1;
    if(DB.account.integrityScore % 10 === 0){
      creditPoints(20, '诚信奖励（累计 10 次抽查通过）', null, { withSavings:false });
      toast('诚信分达标！奖励 +20 分','ok');
    } else {
      toast('已确认真实，诚信分 +1','ok');
    }
  } else {
    if(task){
      if(task.trustLevel === 'trusted') task.trustLevel = 'watch';
      else if(task.trustLevel === 'watch') task.trustLevel = 'audit';
      toast('「' + task.name + '」已降级为' + TRUST_LABEL[task.trustLevel],'warn');
    }
    if(c.status === 'approved' || c.status === 'auto_approved') revokeCheckin(c);
  }
  saveDB(); render();
}
function setTrust(taskId, level){
  var t = taskById(taskId);
  if(!t) return;
  t.trustLevel = level; saveDB(); render();
  toast('「' + t.name + '」信任状态已更新','ok');
}
function checkBadges(){
  var got = false;
  DB.badges.forEach(function(b){
    if(b.achievedAt) return;
    if(badgeHit(b.id, DB)){ b.achievedAt = Date.now(); got = true; }
  });
  if(got){ saveDB(); setTimeout(function(){ toast('解锁新徽章！去成就墙看看','ok'); }, 400); }
  return got;
}

/* ---------- 兑换 ---------- */
function redeem(reward, wallet, cashAmount){
  if(DB.account.mainBalance < reward.price){ toast('积分还不够哦，继续加油','warn'); return; }
  DB.orders.unshift({
    id: uid(), rewardId: reward.id, rewardName: reward.name, tier: reward.tier,
    price: reward.price, date: todayStr(), ts: Date.now(), status:'pending',
    targetWallet: wallet || null, cashAmount: cashAmount || null, deliveredAt: null
  });
  saveDB(); render();
  toast('已提交兑换申请，等爸妈确认','info');
}
function approveOrder(id, ok){
  var o = DB.orders.filter(function(x){ return x.id === id; })[0];
  if(!o) return;
  if(!ok){ o.status = 'rejected'; saveDB(); render(); toast('已驳回该兑换','info'); return; }
  if(DB.account.mainBalance < o.price){ toast('余额不足，无法通过','warn'); return; }
  debitPoints(o.price, '兑换：' + o.rewardName, o.id);
  if(o.targetWallet === 'bead_fund'){
    DB.account.beadFund += (o.cashAmount || 0);
    ledger('transfer', 0, '转入拼豆基金 ' + o.cashAmount + ' 元', o.id);
  }
  if(o.targetWallet === 'free'){
    DB.account.freeWallet += (o.cashAmount || 0);
    ledger('transfer', 0, '转入自由钱包 ' + o.cashAmount + ' 元', o.id);
  }
  if(o.tier === '拼豆') DB.flags.bead = true;
  var r = rewardById(o.rewardId);
  if(r && r.stock != null && r.stock > 0) r.stock -= 1;
  o.status = 'approved';
  checkBadges(); saveDB(); render();
  toast('已通过，等待发放','ok');
}
function deliverOrder(id){
  var o = DB.orders.filter(function(x){ return x.id === id; })[0];
  if(!o) return;
  o.status = 'delivered'; o.deliveredAt = Date.now();
  saveDB(); render();
  toast('已标记为已发放','ok');
}

/* ---------- 界面基础件 ---------- */

  var box = $('#toastbox');
  if(!box) return;
  var el = document.createElement('div');
  el.className = 'toast pop';
  el.style.background = map[kind] || map.info;
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(function(){
    el.style.transition = 'opacity .3s';
    el.style.opacity = '0';
    setTimeout(function(){ el.remove(); }, 320);
  }, 1900);
}
function flyScore(points){
  var el = $('#fly');

  el.style.left = '50%';

    el.style.transition = 'all .9s cubic-bezier(.2,.8,.3,1)';

function openModal(title, bodyHtml, onMount){
  closeModal();
  var w = document.createElement('div');

/* ---------- 自绘 SVG 图表（无外部依赖） ---------- */
function svgArea(data, labels, color){
  var W = 700, H = 190, PL = 34, PR = 10, PT = 14, PB = 24;
  var max = Math.max.apply(null, data.concat([10]));
  var iw = W - PL - PR, ih = H - PT - PB;
  var pts = data.map(function(v,i){
    var x = PL + (data.length <= 1 ? iw / 2 : iw * i / (data.length - 1));
    var y = PT + ih - (v / max) * ih;
    return [x, y];
  });
  var line = pts.map(function(p,i){ return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' ');
  var area = line + ' L' + (PL + iw) + ' ' + (PT + ih) + ' L' + PL + ' ' + (PT + ih) + ' Z';
  var grid = '';
  for(var g = 0; g <= 3; g++){
    var y = PT + ih * g / 3;
    grid += '<line x1="' + PL + '" y1="' + y.toFixed(1) + '" x2="' + (PL+iw) + '" y2="' + y.toFixed(1) + '" stroke="#F5EFE7"/>' +
            '<text x="' + (PL-6) + '" y="' + (y+3).toFixed(1) + '" font-size="9" fill="#B4B2A9" text-anchor="end">' + Math.round(max - max*g/3) + '</text>';
  }
  var xl = '';
  labels.forEach(function(l,i){
    if(i % 5 !== 0 && i !== labels.length - 1) return;
    var x = PL + iw * i / (labels.length - 1);
    xl += '<text x="' + x.toFixed(1) + '" y="' + (H-6) + '" font-size="9" fill="#B4B2A9" text-anchor="middle">' + esc(l) + '</text>';
  });
  var dots = pts.map(function(p,i){
    if(data[i] <= 0) return '';
    return '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="2.6" fill="' + color + '"/>';
  }).join('');
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block">' +
    '<defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0" stop-color="' + color + '" stop-opacity="0.34"/>' +
    '<stop offset="1" stop-color="' + color + '" stop-opacity="0"/></linearGradient></defs>' +
    grid + '<path d="' + area + '" fill="url(#ag)"/>' +
    '<path d="' + line + '" fill="none" stroke="' + color + '" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>' +
    dots + xl + '</svg>';
}
function svgHBars(items, color, unit, maxVal){
  var W = 700, rowH = 26, PL = 150, PR = 44;
  var H = Math.max(items.length * rowH + 10, 40);
  var max = maxVal != null ? maxVal : Math.max.apply(null, items.map(function(x){ return x.v; }).concat([1]));
  var iw = W - PL - PR;
  var out = '';
  items.forEach(function(it,i){
    var y = i * rowH + 4;
    var w = Math.max(2, iw * (it.v / max));
    var label = it.k.length > 11 ? it.k.slice(0, 11) + '…' : it.k;
    out += '<text x="' + (PL-8) + '" y="' + (y+13) + '" font-size="10.5" fill="#7A6E60" text-anchor="end">' + esc(label) + '</text>' +
      '<rect x="' + PL + '" y="' + y + '" width="' + iw + '" height="14" rx="7" fill="#F7F2EA"/>' +
      '<rect x="' + PL + '" y="' + y + '" width="' + w.toFixed(1) + '" height="14" rx="7" fill="' + color + '"/>' +
      '<text x="' + (PL + iw + 6) + '" y="' + (y+12) + '" font-size="10.5" fill="#7A6E60">' + it.v + (unit || '') + '</text>';
  });
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block">' + out + '</svg>';
}
function heatmapHtml(days){
  var cells = '';
  days.forEach(function(d){
    var v = d.v;
    var bg = '#F3EDE4';
    if(v > 0 && v <= 8)   bg = '#FFE1BC';
    if(v > 8 && v <= 18)  bg = '#FFC98A';
    if(v > 18 && v <= 30) bg = '#FF9F43';
    if(v > 30)            bg = '#E8801F';
    cells += '<i title="' + d.d + ' · ' + v + ' 分" style="background:' + bg + '"></i>';
  });
  return '<div class="hm">' + cells + '</div>';
}

function taskCard(t, rec){
  var c = CATS[t.cat] || { color:'#B4B2A9', icon:'📌' };
  var mode = effectiveAuditMode(t);
  var left = freqLeft(t), max = freqMax(t);
  var approved = rec && (rec.status === 'auto_approved' || rec.status === 'approved');
  var pending  = rec && rec.status === 'pending';
  var rejected = rec && rec.status === 'rejected';
  var revoked  = rec && rec.status === 'revoked';
  var btn = '', tag = '';

  if(pending){
    btn = '<div class="tc sm bd" style="padding:9px;border-radius:12px;background:#FFF6E5;color:#B8791F">⏳ 等爸妈确认</div>';
    tag = '<span class="xs mut">待审</span>';
  } else if(left <= 0){
    btn = '<div class="tc sm bd" style="padding:9px;border-radius:12px;background:#EAF7EC;color:#4E9E5B">✔ ' +
          (t.freq === 'once' ? '已完成' : freqWindowLabel(t) + '已完成') +
          (max !== Infinity && max > 1 ? '（' + freqUsed(t) + '/' + max + '）' : '') + '</div>';
  } else if(approved){
    btn = '<button class="btn wide" onclick="onTaskClick(\'' + t.id + '\')" style="background:' + c.color +
          ';color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.12)">再做一次</button>';
    tag = '<span class="xs" style="color:#4E9E5B">已完成 +' + rec.points + '</span>';
  } else {
    btn = '<button class="btn wide" onclick="onTaskClick(\'' + t.id + '\')" style="background:' + c.color +
          ';color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.12)">打卡</button>';
    tag = mode === 'audit' ? '<span class="xs mut">需确认</span>' : '<span class="xs" style="color:#4E9E5B">免审</span>';
  }

  var freqLine = '<div class="xs mut mt2">' + freqText(t) +
    (max !== Infinity && max > 1 ? ' · 已 ' + freqUsed(t) + '/' + max + ' 次' : '') + '</div>';

  var noteLine = '';
  if(rejected)      noteLine = '<div class="xs mt8" style="padding:7px 9px;border-radius:10px;background:#FDECEA;color:#C0453F">↩ 被退回：' + esc(rec.note || '未通过') + '（可以重新打卡）</div>';
  else if(revoked)  noteLine = '<div class="xs mut mt8">这条记录已被撤销</div>';

  return '<div class="card pad" style="' + (left <= 0 ? 'opacity:.88' : '') + '">' +
    '<div class="row between g8 mb8" style="align-items:flex-start">' +
      '<div class="fill">' +
        '<div class="sm bd" style="line-height:1.35">' + esc(t.name) + '</div>' +
        (t.desc ? '<div class="xs mut mt2">' + esc(t.desc) + '</div>' : '') +
        (t.tiers ? '<div class="xs mut mt2">' + t.tiers.map(function(x){ return x.label + ' +' + x.points; }).join(' ／ ') + '</div>' : '') +
        freqLine +
      '</div>' +
      '<div class="tr" style="flex:0 0 auto">' +
        '<div class="lg xb" style="color:' + c.color + '">+' + t.points + '</div>' + tag +
      '</div>' +
    '</div>' + btn + '</div>';
}

      }).join('') + '</div>';

/* ---------- 家长端 · 数据看板 ---------- */
function rangeSum(days){
  var earn = 0, spend = 0;
  for(var i = 0; i < days; i++){
    var ds = dateStr(-i);
    DB.ledger.forEach(function(l){
      if(l.date !== ds) return;
      if(l.type === 'earn') earn += l.points;
      if(l.type === 'spend') spend -= l.points;
    });
  }
  return { earn:earn, spend:spend };
}
function doneRate(days){
  var rigid = activeTasks().filter(function(t){ return t.freq === 'daily'; });
  var total = 0, done = 0;
  for(var i = 0; i < days; i++){
    var ds = dateStr(-i);
    rigid.forEach(function(t){
      total++;
      if(DB.checkins.some(function(c){
        return c.taskId === t.id && c.date === ds && c.status !== 'rejected' && c.status !== 'revoked';
      })) done++;
    });
  }
  return total ? Math.round(done / total * 100) : 0;
}
function inflationReport(){
  var r14 = rangeSum(14);
  var cover = r14.spend > 0 ? r14.earn / r14.spend : (r14.earn > 0 ? 99 : 0);
  var dailySpend = r14.spend / 14;
  var runway = dailySpend > 0 ? Math.round(DB.account.mainBalance / dailySpend) : null;
  var avgTask = Math.round(activeTasks().reduce(function(s,t){ return s + t.points; }, 0) / Math.max(1, activeTasks().length));
  var flags = [];
  if(cover > 1.6) flags.push('近两周收入是支出的 ' + cover.toFixed(1) + ' 倍，积分在快速堆积');
  if(runway != null && runway > 60) flags.push('按当前花法，余额够用 ' + runway + ' 天，奖励显得太便宜');
  if(cover > 0 && cover < 0.6) flags.push('支出明显超过收入，可能定价过高，孩子会失去动力');
  return { cover:cover, runway:runway, avgTask:avgTask, flags:flags, r14:r14 };
}

  var daily = activeTasks().filter(function(t){ return t.freq === 'daily'; }).map(function(t){
    var total = 30, done = 0;
    for(var j = 0; j < 30; j++){
      if(DB.checkins.some(function(c){

      })) done++;
    }
    return { k:t.name, v:Math.round(done / total * 100) };
  }).sort(function(a,b){ return b.v - a.v; });
  var intern = daily.filter(function(x){ return x.v >= 80; });
  if(daily.length){
    html += '<div class="card pad"><div class="bd sm mb8">🌱 内化观察（连续 30 天完成率 ≥ 80%）</div>' +

          }).join('')

function freqFormSync(){
  var f = ($('#t-freq') || {}).value || 'daily';
  var noLim = !!(($('#t-nolimit') || {}).checked);
  var isWindow = (f === 'daily' || f === 'weekly' || f === 'monthly');
  var tw = $('#t-times-wrap'), dw = $('#t-days-wrap');
  if(tw) tw.style.display = (isWindow && !noLim) ? '' : 'none';
  if(dw) dw.style.display = (f === 'custom' && !noLim) ? '' : 'none';
  var hint = $('#t-hint');
  if(hint){
    var n = parseInt(($('#t-times') || {}).value, 10);
    var d = parseInt(($('#t-days') || {}).value, 10);
    var times = (isNaN(n) || n < 1) ? 1 : n;
    var days  = (isNaN(d) || d < 2) ? 2 : d;
    var max = freqMax({ freq:f, freqTimes:times, freqDays:days, noLimit:noLim });
    var preview = freqText({ freq:f, freqTimes:times, freqDays:days, noLimit:noLim });
    var tail;
    if(max === Infinity)   tail = '做完随时能再打卡，不限次数。';
    else if(f === 'once')  tail = '整个记录里只记一次，打完就锁定。';
    else if(f === 'custom')tail = '打完之后要再等 ' + days + ' 天才能重新打卡。';
    else if(f === 'monthly') tail = '本月最多打 ' + max + ' 次卡，到下个月 1 号自动刷新。';
    else if(f === 'weekly')  tail = '本周最多打 ' + max + ' 次卡，到周一自动刷新。';
    else                     tail = '今天最多打 ' + max + ' 次卡，到明天自动刷新。';
    hint.innerHTML = '当前规则：<b>' + preview + '</b><br>' + tail;
  }
}

function saveTaskForm(id){
  var name = ($('#t-name') || {}).value || '';
  var points = parseInt(($('#t-points') || {}).value, 10);
  if(!name.trim()){ toast('任务名称不能为空','warn'); return; }
  if(isNaN(points) || points < 0){ toast('分值要填个数字','warn'); return; }
  var tiers = [];
  document.querySelectorAll('.trow').forEach(function(r){
    var l = r.querySelector('.t-l').value.trim();
    var p = parseInt(r.querySelector('.t-p').value, 10);
    if(l && !isNaN(p)) tiers.push({ label:l, points:p });
  });
  var freq = ($('#t-freq') || {}).value || 'daily';
  var timesRaw = parseInt(($('#t-times') || {}).value, 10);
  var daysRaw  = parseInt(($('#t-days')  || {}).value, 10);
  var noLimit  = !!(($('#t-nolimit') || {}).checked);
  var payload = {
    name: name.trim(), points: points, tiers: tiers.length ? tiers : null,
    cat: ($('#t-cat') || {}).value || '生活',
    freq: freq,
    freqTimes: (isNaN(timesRaw) || timesRaw < 1) ? 1 : Math.min(20, timesRaw),
    freqDays:  (isNaN(daysRaw)  || daysRaw  < 2) ? 2 : Math.min(60, daysRaw),
    noLimit: noLimit,
    auditMode: ($('#t-mode') || {}).value || 'auto',
    desc: ($('#t-desc') || {}).value.trim(),
    active: true
  };
  if(id){
    var t = taskById(id);
    Object.keys(payload).forEach(function(k){ t[k] = payload[k]; });
  } else {
    payload.id = uid(); payload.trustLevel = 'watch'; payload.evi = false;
    DB.tasks.push(payload);
  }
  saveDB(); closeModal(); render();
  toast(id ? '任务已更新' : '任务已新增','ok');
}

/* ---------- 导入导出 / 打印 ---------- */
function download(filename, content, mime){
  var blob = new Blob([content], { type: mime || 'text/plain;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
}
function exportJSON(){
  download('成长工具箱_备份_' + todayStr() + '.json', JSON.stringify(DB, null, 2), 'application/json');
  toast('已导出备份文件','ok');
}
function exportCSV(){
  var rows = [['日期','类型','说明','积分']];
  DB.ledger.slice().reverse().forEach(function(l){
    rows.push([l.date, l.type, (l.desc || '').replace(/,/g, '，'), l.points]);
  });
  var csv = '\ufeff' + rows.map(function(r){ return r.join(','); }).join('\n');
  download('成长工具箱_流水_' + todayStr() + '.csv', csv, 'text/csv;charset=utf-8');
  toast('已导出流水 CSV','ok');
}
function importJSON(input){
  var f = input.files && input.files[0];
  if(!f) return;
  var rd = new FileReader();
  rd.onload = function(e){
    try {
      var obj = JSON.parse(e.target.result);
      if(!obj || !obj.account || !obj.config) throw new Error('bad');
      DB = obj;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(DB));
      loadDB();
      toast('数据已恢复','ok');
      UI.parentUnlocked = false; render();
    } catch(err){ toast('文件格式不正确','err'); }
  };
  rd.readAsText(f);
  input.value = '';
}

      '<div style="font-size:12px;color:#666;margin-bottom:6px">' + d + ' 分面值 · 剪下备用</div>' +
      '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">';
    for(var i = 0; i < 12; i++){
      blocks += '<div style="border:2px solid ' + color[d] + ';border-radius:10px;padding:8px;text-align:center;' +
        'color:' + color[d] + ';font-weight:900;font-size:15px">' + d + '<div style="font-size:8px;font-weight:400">' +
        esc(DB.config.kidName) + ' 成长积分</div></div>';
    }
    blocks += '</div></div>';
  });
  openPrint('<div class="sheet"><h1 style="text-align:center;font-size:20px;margin:0 0 14px">成长积分卡币（可打印）</h1>' + blocks + '</div>');
}
function printWeekReport(){
  var ws = weekStart();
  var earned = 0, spent = 0, cnt = 0;
  DB.ledger.forEach(function(l){
    if(l.date < ws) return;
    if(l.type === 'earn') earned += l.points;
    if(l.type === 'spend') spent -= l.points;
  });
  cnt = DB.checkins.filter(function(c){
    return c.date >= ws && c.status !== 'rejected' && c.status !== 'revoked';
  }).length;
  var topMap = {};
  DB.checkins.filter(function(c){ return c.date >= ws && c.status !== 'rejected'; }).forEach(function(c){
    topMap[c.taskName] = (topMap[c.taskName] || 0) + 1;
  });
  var top = Object.keys(topMap).map(function(k){ return { k:k, v:topMap[k] }; })
    .sort(function(a,b){ return b.v - a.v; }).slice(0, 5);
  var newBadges = DB.badges.filter(function(b){ return b.achievedAt && dateOffsetOf(new Date(b.achievedAt).toISOString().slice(0,10)) < 7; });
  var html = '<div class="sheet">' +
    '<h1 style="text-align:center;font-size:22px;margin:0 0 4px">本周战报</h1>' +
    '<p style="text-align:center;color:#888;font-size:12px;margin:0 0 20px">' + esc(DB.config.kidName) +
      ' · ' + ws + ' 起的这一周</p>' +
    '<div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px">' +
      '<div style="flex:1;min-width:110px;background:#FFF8F0;border-radius:12px;padding:12px"><div style="font-size:11px;color:#999">本周挣到</div>' +
      '<div style="font-size:26px;font-weight:900;color:#FF9F43">' + earned + '</div></div>' +
      '<div style="flex:1;min-width:110px;background:#FFF8F0;border-radius:12px;padding:12px"><div style="font-size:11px;color:#999">完成任务</div>' +
      '<div style="font-size:26px;font-weight:900;color:#6BCB77">' + cnt + '</div></div>' +
      '<div style="flex:1;min-width:110px;background:#FFF8F0;border-radius:12px;padding:12px"><div style="font-size:11px;color:#999">连续打卡</div>' +
      '<div style="font-size:26px;font-weight:900;color:#4D96FF">' + DB.account.streakDays + '</div></div>' +
      '<div style="flex:1;min-width:110px;background:#FFF8F0;border-radius:12px;padding:12px"><div style="font-size:11px;color:#999">当前余额</div>' +
      '<div style="font-size:26px;font-weight:900;color:#9D7CE8">' + DB.account.mainBalance + '</div></div>' +
    '</div>' +
    '<h2 style="font-size:15px;margin:0 0 8px">这周做得最多的是</h2>' +
    (top.length
      ? '<table class="tb"><thead><tr><th>任务</th><th>次数</th></tr></thead><tbody>' +
        top.map(function(x){ return '<tr><td>' + esc(x.k) + '</td><td>' + x.v + ' 次</td></tr>'; }).join('') + '</tbody></table>'
      : '<p style="font-size:13px;color:#888">这周还没有打卡记录，下周一起加油。</p>') +
    (newBadges.length
      ? '<h2 style="font-size:15px;margin:18px 0 8px">新解锁的徽章</h2><p style="font-size:20px;letter-spacing:8px">' +
        newBadges.map(function(b){ return b.icon; }).join('') + '</p>'
      : '') +
    '<h2 style="font-size:15px;margin:18px 0 8px">爸爸妈妈想对你说</h2>' +
    '<p style="font-size:13px;line-height:2.2;color:#555">___________________________________________________<br>' +
    '___________________________________________________</p>' +
    '<p style="margin-top:24px;font-size:12px;color:#999">下周目标：' +
    '__________________________________________</p></div>';
  openPrint(html);
}

/* ---------- PIN 门 ---------- */
function viewPinGate(){
  if(DB.config.parentPin === null || DB.config.parentPin === undefined){
    return '<div class="card padl tc">' +
      '<div style="font-size:38px">🔐</div>' +
      '<div class="bd mt6 mb2">首次使用，先设置家长端 PIN</div>' +
      '<div class="xs mut mb16">4 位数字，用于保护审核与配置权限，孩子不会自己通过审核</div>' +
      '<input id="pin-new" type="tel" maxlength="4" inputmode="numeric" autofocus placeholder="输入 4 位数字" ' +
      'onkeydown="if(event.key===\'Enter\')setupPin()" ' +
      'style="text-align:center;font-size:24px;padding:14px;letter-spacing:10px">' +
      '<button class="btn pri wide mt12" onclick="setupPin()">设置并进入</button></div>';
  }
  return '<div class="card padl tc">' +
    '<div style="font-size:38px">🔐</div>' +
    '<div class="bd mt6 mb2">家长端</div>' +
    '<div class="xs mut mb16">请输入 PIN 码</div>' +
    '<input id="pin-in" type="tel" maxlength="4" inputmode="numeric" autofocus placeholder="4 位数字" ' +
    'onkeydown="if(event.key===\'Enter\')tryPin()" ' +
    'style="text-align:center;font-size:24px;padding:14px;letter-spacing:10px">' +
    '<button class="btn pri wide mt12" onclick="tryPin()">进入</button></div>';
}
function setupPin(){
  var v = ($('#pin-new') || {}).value || '';
  if(!/^\d{4}$/.test(v)){ toast('请输入 4 位数字','warn'); return; }
  DB.config.parentPin = v; saveDB(); UI.parentUnlocked = true; render();
}
function tryPin(){
  var el = $('#pin-in');
  var v = el ? el.value : '';
  if(v === DB.config.parentPin){ UI.parentUnlocked = true; render(); return; }
  toast('PIN 码不正确','err');
  if(el){
    el.value = '';
    var card = el.parentNode;
    if(card){ card.classList.add('shake'); setTimeout(function(){ card.classList.remove('shake'); }, 420); }
  }
}

/* ============================================================
   Shell · 导航 · 主渲染
   ============================================================ */
var KID_TABS = [
  {k:'today',   i:'📅', t:'今日'},
  {k:'shop',    i:'🎁', t:'商城'},
  {k:'account', i:'💰', t:'我的'},
  {k:'badges',  i:'🏅', t:'成就'}
];
var PARENT_TABS = [
  {k:'audit',     i:'✅', t:'审核'},
  {k:'trust',     i:'🤝', t:'约定'},
  {k:'dashboard', i:'📊', t:'看板'},
  {k:'config',    i:'⚙️', t:'设置'}
];

function switchRole(){
  if(UI.view === 'kid'){ UI.view = 'parent'; UI.parentUnlocked = false; }
  else { UI.view = 'kid'; UI.parentUnlocked = false; }
  closeModal();
  window.scrollTo(0, 0);
  render();
}

function navBar(items, cur, tabVar){
  return '<div class="bnav">' + items.map(function(it){
    var on = it.k === cur;
    return '<button class="' + (on ? 'on' : '') + '" onclick="UI.' + tabVar + '=\'' + it.k + '\';render()">' +
      '<span class="bi">' + it.i + '</span><span class="bt">' + it.t + '</span></button>';
  }).join('') + '</div>';
}

function render(){
  var app = $('#app');
  if(!app) return;
  closeModal();

  /* 家长端未解锁 → PIN 门 */
  if(UI.view === 'parent' && !UI.parentUnlocked){
    app.innerHTML = '<div class="wrap">' + viewPinGate() +
      '<div class="tc mt12"><button class="btn gh tiny" onclick="switchRole()">← 回到孩子端</button></div>' +
      '</div>';
    return;
  }

  var isKid = UI.view === 'kid';
  var head = '<div class="row between mb12" style="padding:2px 4px;align-items:flex-start">' +
      '<div><div class="bd lg">' +
        (isKid ? '🌟 ' + esc(DB.config.kidName || '宝贝') + '的成长工具箱' : '🛠 家长管理台') +
      '</div><div class="xs mut mt4">' + todayStr() +
        (isKid ? ' · 今天也要加油呀' : ' · 审核 · 约定 · 看板 · 设置') + '</div></div>' +
      '<button class="btn gh tiny" style="white-space:nowrap;flex:0 0 auto" onclick="switchRole()">' +
        (isKid ? '家长端 🔒' : '孩子端 →') + '</button></div>';

  var body, nav;
  if(isKid){
    body = UI.kidTab === 'shop'    ? viewKidShop() :
           UI.kidTab === 'account' ? viewKidAccount() :
           UI.kidTab === 'badges'  ? viewKidBadges()  : viewKidToday();
    nav = navBar(KID_TABS, UI.kidTab, 'kidTab');
  } else {
    body = UI.parentTab === 'trust'     ? viewParentTrust() :
           UI.parentTab === 'dashboard' ? viewParentDashboard() :
           UI.parentTab === 'config'    ? viewParentConfig()    : viewParentAudit();
    nav = navBar(PARENT_TABS, UI.parentTab, 'parentTab');
  }

  app.innerHTML = '<div class="wrap">' + head + body + '</div>' + nav;
}

/* ============================================================
   启动
   ============================================================ */
function boot(){
  loadDB();
  updateStreak();
  checkBadges();
  render();
  // 首次使用提示
  if(!DB.config.parentPin){
    setTimeout(function(){ toast('第一次用？先点右上角「家长端」设个 PIN 码','info'); }, 900);
  }
}
if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}
</script>
</body>
</html>
