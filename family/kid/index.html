html,body{margin:0;padding:0}
body{

.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;border:0;border-radius:12px;

.btn.pri{background:var(--orange);color:#fff}
.btn.ok{background:var(--green);color:#fff}
.btn.bl{background:var(--blue);color:#fff}
.btn.pk{background:var(--pink);color:#fff}
.btn.dk{background:var(--night);color:#FFFBF2}
.btn.gh{background:#F7F0E3;color:#8C7E68}
.btn.wide{width:100%}
.btn.tiny{padding:5px 9px;font-size:11px;border-radius:9px}
.btn:disabled{opacity:.4;cursor:not-allowed}
input,select,textarea{font-family:inherit;font-size:14px;padding:9px 11px;border:1.5px solid var(--line);
  border-radius:10px;background:#fff;color:var(--ink);width:100%;outline:none;transition:border-color .15s}

label.fl{font-size:11px;color:var(--sub);display:block;margin-bottom:4px}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#B9B0A2 50%),linear-gradient(135deg,#B9B0A2 50%,transparent 50%);

.tabs{display:flex;gap:5px;background:#fff;border-radius:16px;padding:5px;box-shadow:0 3px 0 rgba(197,168,116,.18)}
.tabs button{flex:1;border:0;background:transparent;border-radius:12px;padding:9px 3px;font-size:12px;font-weight:700;
  color:var(--sub);cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap}
.tabs button.on{background:var(--night);color:#FFFBF2}
.bead{width:13px;height:13px;border-radius:4px;flex:0 0 auto;

.hbar{height:10px;border-radius:6px;background:#F7F0E3;overflow:hidden}

.dash{border:1.5px dashed #EDE1CB;border-radius:14px;background:transparent}

.chip{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;background:#F7F0E3;color:#8C7E68}
.pill{padding:7px 14px;border-radius:20px;font-size:13px;font-weight:700;border:0;cursor:pointer;font-family:inherit;

.pill.on{color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.12)}

.tierbar{display:flex;flex-wrap:wrap;gap:8px}
.tierbar .pill{padding:6px 11px;font-size:12.5px}
.mask{position:fixed;inset:0;background:rgba(48,36,24,.4);display:flex;align-items:center;justify-content:center;

.mask.bottom{align-items:flex-end}
.modal{background:#fff;border-radius:20px;padding:18px;width:100%;max-width:460px;max-height:88vh;overflow:auto;

@keyframes pop{0%{transform:scale(.9);opacity:0}60%{transform:scale(1.03)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .26s cubic-bezier(.4,1.4,.6,1) both}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .3s}
#toastbox{position:fixed;top:16px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:999;pointer-events:none}
.toast{padding:10px 18px;border-radius:14px;color:#fff;font-size:13px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.18)}
#fly{position:fixed;z-index:999;font-weight:900;font-size:26px;color:var(--orange);text-shadow:0 2px 0 #fff;pointer-events:none}
table.tb{width:100%;border-collapse:collapse;font-size:12px}
table.tb th,table.tb td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
table.tb th{color:var(--sub);font-weight:700;font-size:11px}
.hm{display:grid;grid-template-columns:repeat(8,1fr);gap:3px}
.hm i{display:block;padding-bottom:100%;border-radius:3px;background:#F7F0E3}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:800;display:flex;gap:4px;max-width:780px;margin:0 auto;

.bnav button .bt{font-size:10px;font-weight:700;color:var(--sub)}
.bnav button.on{background:#FFF3DC}
.bnav button.on .bi{filter:none}
.bnav button.on .bt{color:var(--orange)}

.khero{position:relative;overflow:hidden}

#print-area{display:none}
@media print{
  body{background:#fff}
  body>*{display:none!important}
  #print-area{display:block!important}
  #print-area .sheet{page-break-after:always}
}
@media(max-width:520px){
  .wrap{padding:10px 10px 90px}
  .xxl{font-size:22px}.huge{font-size:28px}
}
</style>

function dateStr(offset){

}
function monthStr(offset){
  var d = new Date(); d.setDate(1); d.setMonth(d.getMonth() + (offset||0));

}

}
function dateOffsetOf(ds){

/* 取消拼豆基金（2026-09-19）：把基金余额并入「零花钱」，历史订单改走零花钱通道。
   每一步都幂等——可以反复调用。
   注意：云端拉取（cloudAdopt / cloudMerge）会整体替换 DB，所以那两处也必须调用本函数，
   否则另一台设备推上来的旧数据会让基金余额「复活」。 */
function migrateDB(){
  if(!DB) return;
  if(!DB.meta) DB.meta = {};
  if(!Array.isArray(DB.ledger)) DB.ledger = [];
  if(!Array.isArray(DB.orders)) DB.orders = [];
  /* 备注错别字：把旧数据里的「单身周」改成「单周」（只修错字，不改规则） */
  (DB.rewards || []).forEach(function(r){
    if(r && typeof r.note === 'string') r.note = r.note.replace(/单身周/g, '单周');
  });
  /* 旧订单里选过「拼豆基金」通道的，改走零花钱通道，金额不变 */
  DB.orders.forEach(function(o){ if(o && o.targetWallet === 'bead_fund') o.targetWallet = 'free'; });
  /* 基金余额并入零花钱。搬完置 0，所以这段天然只会真正执行一次 */
  if(DB.account && Number(DB.account.beadFund || 0) > 0){
    var moved = Number(DB.account.beadFund);
    DB.account.freeWallet = Number(DB.account.freeWallet || 0) + moved;
    ledger('transfer', 0, '拼豆基金取消，' + moved + ' 元并入零花钱', null);
    DB.account.beadFund = 0;
  }
  DB.meta.beadFundMerged = true;
}
function loadDB(){
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if(!raw){ DB = freshDB(); saveDB(); return; }
    DB = JSON.parse(raw);
    var def = freshDB();
    if(!DB.config) DB.config = def.config;
    Object.keys(CONFIG_DEFAULT).forEach(function(k){
      if(DB.config[k] === undefined || DB.config[k] === null && k !== 'parentPin') DB.config[k] = CONFIG_DEFAULT[k];
    });
    if(!DB.tasks)   DB.tasks   = def.tasks;
    if(!DB.rewards) DB.rewards = def.rewards;
    if(!DB.badges){
      DB.badges = def.badges;
    } else {
      def.badges.forEach(function(b){
        if(!DB.badges.some(function(x){ return x.id === b.id; })) DB.badges.push(b);
      });
    }
    if(!DB.checkins) DB.checkins = [];
    if(!DB.orders)   DB.orders   = [];
    if(!DB.ledger)   DB.ledger   = [];
    if(!DB.wishes)   DB.wishes   = [];
    if(!DB.pledges)  DB.pledges  = [];
    if(!DB.flags)    DB.flags    = { moon:false, bead:false, interest:false };
    if(DB.flags.interest === undefined) DB.flags.interest = false;
    if(!DB.account)  DB.account  = def.account;
    if(DB.account.freeWallet === undefined) DB.account.freeWallet = 0;
    if(DB.account.beadFund === undefined)   DB.account.beadFund = 0;
    if(!DB.meta) DB.meta = { createdAt: Date.now(), interestMonth: monthStr(0) };
    if(!DB.meta.interestMonth) DB.meta.interestMonth = monthStr(0);
  } catch(e){
    console.error(e);
    DB = freshDB();
    saveDB();
  }
  migrateDB();
  settleInterest();
}
function saveDB(){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); }
  catch(e){ toast('保存失败：浏览器存储空间不足','err'); }
  /* 云端同步已开启时，异步把这次改动推上去（未开启则直接跳过） */
  if(typeof cloudQueue === 'function') cloudQueue();
}

/* ---------- 账本与积分引擎 ---------- */
function ledger(type, points, desc, refId){
  DB.ledger.unshift({ id:uid(), date:todayStr(), ts:Date.now(), type:type, points:points, desc:desc, refId:refId || null });
  if(DB.ledger.length > 2000) DB.ledger.length = 2000;
}
function calcLevel(totalEarned){
  var idx = 0;
  LEVELS.forEach(function(lv,i){ if(totalEarned >= lv.min) idx = i; });
  return idx;
}
function levelProgress(){
  var idx = calcLevel(DB.account.totalEarned);
  var cur = LEVELS[idx], next = LEVELS[idx+1];
  if(!next) return { idx:idx, cur:cur, next:null, pct:100, need:0 };
  var span = next.min - cur.min;
  var done = DB.account.totalEarned - cur.min;
  return { idx:idx, cur:cur, next:next, pct:Math.min(100, Math.round(done / span * 100)), need:next.min - DB.account.totalEarned };
}
function creditPoints(points, desc, refId, opts){
  opts = opts || {};
  var savings = 0;
  if(opts.withSavings !== false) savings = Math.floor(points * DB.config.savingsRate);
  DB.account.mainBalance += (points - savings);
  DB.account.dreamBalance += savings;
  DB.account.totalEarned += points;
  ledger('earn', points, desc, refId);
  if(savings > 0) ledger('savings', -savings, '强制储蓄转入梦想账户（' + desc + '）', refId);
  checkBadges();
  checkWishes();
}
function debitPoints(points, desc, refId){
  DB.account.mainBalance -= points;
  DB.account.totalSpent += points;
  ledger('spend', -points, desc, refId);
}
function revokeCheckin(c){
  var pts = c.points;
  var savings = Math.floor(pts * DB.config.savingsRate);
  DB.account.mainBalance -= (pts - savings);
  DB.account.dreamBalance -= savings;
  DB.account.totalEarned -= pts;
  c.status = 'revoked';
  ledger('spend', -pts, '撤销（虚报）：' + c.taskName, c.id);
}

/* 月度利息结算：梦想账户月息（借鉴 Greenlight / FamZoo 的家长付息机制） */
function settleInterest(){
  if(!DB || !DB.config || !DB.meta) return;
  var rate = Number(DB.config.dreamInterestRate) || 0;
  var guard = 0;
  while(DB.meta.interestMonth < monthStr(0) && guard++ < 24){
    var next = DB.meta.interestMonth;
    var parts = next.split('-');
    var d = new Date(Number(parts[0]), Number(parts[1]), 1);
    DB.meta.interestMonth = d.getFullYear() + '-' + pad2(d.getMonth() + 1);
    if(rate > 0 && DB.account.dreamBalance > 0){
      var interest = Math.max(1, Math.round(DB.account.dreamBalance * rate));
      DB.account.dreamBalance += interest;
      ledger('bonus', interest, '梦想账户月息结算（' + rate * 100 + '%）', null);
      DB.flags.interest = true;
    }
  }
  saveDB();
}

/* ---------- 频次与次数上限引擎 ----------
   规则来源：任务上的 freq / freqTimes / freqDays / noLimit
     daily   + freqTimes=1 → 一天一次（默认）
     daily   + freqTimes=2 → 一天最多两次
     weekly  + freqTimes=3 → 一周最多三次
     monthly + freqTimes=1 → 一月一次
     custom  + freqDays=3  → 每 3 天一次
     once                  → 这辈子只记一次
     noLimit               → 不限次数
   ============================================ */
function freqTimesOf(t){ var n = parseInt(t.freqTimes, 10); return (isNaN(n) || n < 1) ? 1 : n; }
function freqDaysOf(t){ var n = parseInt(t.freqDays, 10); return (isNaN(n) || n < 2) ? 2 : n; }
function freqWindowLabel(t){
  if(t.freq === 'weekly')  return '本周';
  if(t.freq === 'monthly') return '本月';
  if(t.freq === 'custom')  return '近' + freqDaysOf(t) + '天';
  return '今天';
}
function freqPeriodStart(t){
  if(t.freq === 'weekly')  return weekStart();
  if(t.freq === 'monthly') return monthStr(0) + '-01';
  if(t.freq === 'custom')  return dateStr(-(freqDaysOf(t) - 1));
  return todayStr();
}
function freqUsed(t){
  if(t.noLimit) return 0;
  var ok = function(c){ return c.taskId === t.id && c.status !== 'rejected' && c.status !== 'revoked'; };
  if(t.freq === 'once') return DB.checkins.filter(ok).length;
  var s = freqPeriodStart(t);
  return DB.checkins.filter(function(c){ return ok(c) && c.date >= s; }).length;
}
function freqMax(t){
  if(t.noLimit) return Infinity;
  if(t.freq === 'once' || t.freq === 'custom') return 1;
  return freqTimesOf(t);
}
function freqLeft(t){ return Math.max(0, freqMax(t) - freqUsed(t)); }
function freqDone(t){ return freqLeft(t) <= 0; }
function freqText(t){
  if(t.noLimit) return '不限次数';
  if(t.freq === 'once') return '只记一次';
  if(t.freq === 'custom') return '每 ' + freqDaysOf(t) + ' 天一次';
  var n = freqTimesOf(t), u = FREQ_UNIT[t.freq] || '天';
  return n > 1 ? '每' + u + n + '次' : '每' + u + '一次';
}
function dailyDone(task){ return freqDone(task); }

/* ---------- 奖品兑换限制引擎 ----------
   规则来源：商品上的 rFreq / rTimes / rDays / rNoLimit
   语义与打卡频次一致，但统计对象是订单 DB.orders
   （被驳回 / 未通过的订单不占额度）
   ============================================ */
function rTimesOf(r){ var n = parseInt(r.rTimes, 10); return (isNaN(n) || n < 1) ? 1 : n; }
function rDaysOf(r){ var n = parseInt(r.rDays, 10); return (isNaN(n) || n < 2) ? 2 : n; }
function rHasLimit(r){ return !!r.rFreq && !r.rNoLimit; }
function rWindowLabel(r){
  if(r.rFreq === 'weekly')  return '本周';
  if(r.rFreq === 'monthly') return '本月';
  if(r.rFreq === 'custom')  return '近' + rDaysOf(r) + '天';
  return '今天';
}
function rPeriodStart(r){
  if(r.rFreq === 'weekly')  return weekStart();
  if(r.rFreq === 'monthly') return monthStr(0) + '-01';
  if(r.rFreq === 'custom')  return dateStr(-(rDaysOf(r) - 1));
  return todayStr();
}
function rUsed(r){
  if(!rHasLimit(r)) return 0;
  var ok = function(o){ return o.rewardId === r.id && o.status !== 'rejected'; };
  if(r.rFreq === 'once') return DB.orders.filter(ok).length;
  var s = rPeriodStart(r);
  return DB.orders.filter(function(o){ return ok(o) && o.date >= s; }).length;
}
function rMax(r){
  if(!rHasLimit(r)) return Infinity;
  if(r.rFreq === 'once' || r.rFreq === 'custom') return 1;
  return rTimesOf(r);
}
function rLeft(r){ return Math.max(0, rMax(r) - rUsed(r)); }
function rDone(r){ return rLeft(r) <= 0; }
function rLimitText(r){
  if(!rHasLimit(r)) return '不限次数';
  if(r.rFreq === 'once') return '只能兑换一次';
  if(r.rFreq === 'custom') return '每 ' + rDaysOf(r) + ' 天限兑换一次';
  var n = rTimesOf(r), u = FREQ_UNIT[r.rFreq] || '天';
  return n > 1 ? '每' + u + '最多兑换 ' + n + ' 次' : '每' + u + '限兑换一次';
}
function rDoneMsg(r){
  if(r.rFreq === 'once') return '「' + r.name + '」只能兑换一次，已经换过啦';
  return '「' + r.name + '」' + rWindowLabel(r) + '最多兑换 ' + rMax(r) + ' 次，已经用完啦';
}
function rNextHint(r){
  if(r.rFreq === 'once') return '机会已经用掉，不再刷新。';
  if(r.rFreq === 'custom') return '再等 ' + rDaysOf(r) + ' 天就能重新兑换。';
  if(r.rFreq === 'weekly') return '下周一自动刷新。';
  if(r.rFreq === 'monthly') return '下个月 1 号自动刷新。';
  return '明天自动刷新。';
}
function updateStreak(){
  var days = DB.checkins
    .filter(function(c){ return c.status === 'approved' || c.status === 'auto_approved'; })
    .map(function(c){ return c.date; });
  days = days.filter(function(v,i,a){ return a.indexOf(v) === i; });
  if(!days.length){ DB.account.streakDays = 0; return; }
  var streak = 0;
  for(var i = 0; i < 400; i++){
    if(days.indexOf(dateStr(-i)) >= 0) streak++;
    else if(i > 0) break;
  }
  DB.account.streakDays = streak;
}
function pointsOn(ds){
  return DB.ledger.filter(function(l){ return l.date === ds && l.type === 'earn'; })
                  .reduce(function(s,l){ return s + l.points; }, 0);
}

/* ---------- 打卡 / 审核 ---------- */
function doCheckIn(task, tierLabel){
  if(freqLeft(task) <= 0){
    toast(task.freq === 'once' ? '这项已经完成过啦' : freqWindowLabel(task) + '的次数已经用完啦，下次再来',
      'warn');
    return;
  }
  var points = task.points;
  if(task.tiers && tierLabel != null){
    var t = task.tiers.filter(function(x){ return x.label === tierLabel; })[0];
    if(t) points = t.points;
  }
  var mode = effectiveAuditMode(task);
  var usedPts = autoApprovedToday().reduce(function(s,c){ return s + c.points; }, 0);
  var usedCnt = autoApprovedToday().length;
  var overLimit = (usedPts + points > DB.config.freeAuditDailyPoints) || (usedCnt >= DB.config.freeAuditDailyCount);
  var status = (mode === 'audit' || overLimit) ? 'pending' : 'auto_approved';

  var rec = {
    id: uid(), taskId: task.id, taskName: task.name, cat: task.cat,
    tierLabel: tierLabel || null, points: points,
    date: todayStr(), ts: Date.now(),
    status: status, note: '', spotCheckStatus:'none',
    approvedAt: status === 'auto_approved' ? Date.now() : null
  };
  DB.checkins.unshift(rec);

  if(status === 'auto_approved'){
    if(task.id === 't12') DB.flags.moon = true;
    updateStreak();
    creditPoints(points, task.name + (tierLabel ? '（' + tierLabel + '）' : ''), rec.id);
    saveDB();
    flyScore(points);
    toast('+' + points + ' 分！真棒','ok');
  } else {
    saveDB();
    if(overLimit && mode !== 'audit') toast('今天的免审额度用完了，剩下的要等爸妈确认哦','warn');
    else if(DB.config.spotCheckRate > 0 && Math.random() < 0.3) toast('已提交，等爸妈确认','info');
    else toast('已提交，等爸妈确认','info');
  }
  render();
}
function approveCheckIn(id, ok, note){
  var c = DB.checkins.filter(function(x){ return x.id === id; })[0];
  if(!c) return;
  if(ok){
    if(c.status === 'pending'){
      c.status = 'approved'; c.approvedAt = Date.now(); c.note = '';
      if(c.taskId === 't12') DB.flags.moon = true;
      updateStreak();
      creditPoints(c.points, c.taskName + (c.tierLabel ? '（' + c.tierLabel + '）' : ''), c.id);

      if(task.trustLevel === 'trusted') task.trustLevel = 'watch';

      toast('「' + task.name + '」已降级为' + TRUST_LABEL[task.trustLevel],'warn');

/* ---------- 自绘 SVG 图表（无外部依赖） ---------- */
function svgArea(data, labels, color){
  var W = 700, H = 190, PL = 34, PR = 10, PT = 14, PB = 24;
  var max = Math.max.apply(null, data.concat([10]));
  var iw = W - PL - PR, ih = H - PT - PB;
  var pts = data.map(function(v,i){
    var x = PL + (data.length <= 1 ? iw / 2 : iw * i / (data.length - 1));
    var y = PT + ih - (v / max) * ih;
    return [x, y];
  });
  var line = pts.map(function(p,i){ return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' ');
  var area = line + ' L' + (PL + iw) + ' ' + (PT + ih) + ' L' + PL + ' ' + (PT + ih) + ' Z';
  var grid = '';
  for(var g = 0; g <= 3; g++){
    var y = PT + ih * g / 3;
    grid += '<line x1="' + PL + '" y1="' + y.toFixed(1) + '" x2="' + (PL+iw) + '" y2="' + y.toFixed(1) + '" stroke="#F8F1E5"/>' +
            '<text x="' + (PL-6) + '" y="' + (y+3).toFixed(1) + '" font-size="9" fill="#B9B0A2" text-anchor="end">' + Math.round(max - max*g/3) + '</text>';
  }
  var xl = '';
  labels.forEach(function(l,i){
    if(i % 5 !== 0 && i !== labels.length - 1) return;
    var x = PL + iw * i / (labels.length - 1);
    xl += '<text x="' + x.toFixed(1) + '" y="' + (H-6) + '" font-size="9" fill="#B9B0A2" text-anchor="middle">' + esc(l) + '</text>';
  });
  var dots = pts.map(function(p,i){
    if(data[i] <= 0) return '';
    return '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="2.6" fill="' + color + '"/>';
  }).join('');
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block">' +
    '<defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0" stop-color="' + color + '" stop-opacity="0.34"/>' +
    '<stop offset="1" stop-color="' + color + '" stop-opacity="0"/></linearGradient></defs>' +
    grid + '<path d="' + area + '" fill="url(#ag)"/>' +
    '<path d="' + line + '" fill="none" stroke="' + color + '" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>' +
    dots + xl + '</svg>';
}
function svgHBars(items, color, unit, maxVal){
  var W = 700, rowH = 26, PL = 150, PR = 44;
  var H = Math.max(items.length * rowH + 10, 40);
  var max = maxVal != null ? maxVal : Math.max.apply(null, items.map(function(x){ return x.v; }).concat([1]));
  var iw = W - PL - PR;
  var out = '';
  items.forEach(function(it,i){
    var y = i * rowH + 4;
    var w = Math.max(2, iw * (it.v / max));
    var label = it.k.length > 11 ? it.k.slice(0, 11) + '…' : it.k;
    out += '<text x="' + (PL-8) + '" y="' + (y+13) + '" font-size="10.5" fill="#7E7159" text-anchor="end">' + esc(label) + '</text>' +
      '<rect x="' + PL + '" y="' + y + '" width="' + iw + '" height="14" rx="7" fill="#FAF3E7"/>' +
      '<rect x="' + PL + '" y="' + y + '" width="' + w.toFixed(1) + '" height="14" rx="7" fill="' + color + '"/>' +
      '<text x="' + (PL + iw + 6) + '" y="' + (y+12) + '" font-size="10.5" fill="#7E7159">' + it.v + (unit || '') + '</text>';
  });
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block">' + out + '</svg>';
}
function heatmapHtml(days){
  var cells = '';
  days.forEach(function(d){
    var v = d.v;
    var bg = '#F7F0E3';
    if(v > 0 && v <= 8)   bg = '#FFE6C4';
    if(v > 8 && v <= 18)  bg = '#FFD79A';
    if(v > 18 && v <= 30) bg = '#F5A524';
    if(v > 30)            bg = '#D98E12';
    cells += '<i title="' + d.d + ' · ' + v + ' 分" style="background:' + bg + '"></i>';
  });
  return '<div class="hm">' + cells + '</div>';
}

    html += '<div class="card pad mb12" style="background:#FFF7F6">' +
      '<div class="sm bd mb6" style="color:#C0453F">爸妈的反馈</div>' +
      rejected.map(function(c){
        return '<div class="xs mut">· ' + esc(c.taskName) + '：' + esc(c.note || '未通过') + '</div>';
      }).join('') + '</div>';
  }

  CAT_ORDER.forEach(function(cat){
    var list = activeTasks().filter(function(t){ return t.cat === cat; });
    if(!list.length) return;
    var c = CATS[cat];
    var doneCount = list.filter(function(t){ return dailyDone(t); }).length;
    html += '<div class="mb16"><div class="row g8 mb8" style="padding:0 4px">' +
      '<span class="bead" style="background:' + c.color + '"></span>' +
      '<span class="bd">' + c.icon + ' ' + cat + '</span>' +
      '<span class="xs mut" style="margin-left:auto">' + doneCount + ' / ' + list.length + '</span>' +
      '</div><div class="grid2">';
    list.forEach(function(t){
      var valid = function(x){ return x.taskId === t.id && x.status !== 'rejected' && x.status !== 'revoked'; };
      var s = freqPeriodStart(t);
      var rec = null;
      if(t.freq === 'once'){
        rec = DB.checkins.filter(valid)[0] || null;
      } else {
        rec = DB.checkins.filter(function(x){ return valid(x) && x.date >= s; })[0] || null;
      }
      if(!rec){   /* 没有已完成记录 → 退回展示待审 / 被退回 */
        var pend = DB.checkins.filter(function(x){ return x.taskId === t.id && x.status === 'pending'; })[0];
        if(pend) rec = pend;
        else {
          var rej = DB.checkins.filter(function(x){
            return x.taskId === t.id && x.status === 'rejected' && (t.freq === 'once' || x.date >= s);
          })[0];
          if(rej) rec = rej;
        }
      }
      html += taskCard(t, rec);
    });
    html += '</div></div>';
  });

  var pend = DB.orders.filter(function(o){ return o.status === 'approved'; });
  if(pend.length){
    html += '<div class="card pad mb12"><div class="sm bd mb6">待发放 · 记得找爸妈要</div>' +
      pend.map(function(o){
        return '<div class="row between list mb4"><span class="sm">' + esc(o.rewardName) + '</span>' +
          '<button class="btn ok tiny" onclick="deliverOrder(\'' + o.id + '\')">我收到了</button></div>';
      }).join('') + '</div>';
  }
  return html;
}
function onTaskClick(taskId){
  var t = taskById(taskId);
  if(!t) return;
  if(freqLeft(t) <= 0){
    toast(t.freq === 'once' ? '这项已经完成过啦' : freqWindowLabel(t) + '的次数用完了', 'warn');
    return;
  }
  var go = function(){
    if(t.tiers){ showTierPicker(t); return; }
    doCheckIn(t, null);

  /* 云端没开 → 先说清楚这次不会同步，再打卡 */
  if(syncGuardNeeded()){
    if(!UI.syncAsked){ syncGuardDialog(go); return; }
    toast('这次打卡没同步到云端（「我的」里可开启）', 'warn');

function onRedeem(rewardId){

  if(r.walletOption){ showCashConfirm(r); return; }
  var extra = r.note ? '\n\n【使用规则】' + r.note : '';
  confirmBox('确定用 ' + r.price + ' 分兑换「' + r.name + '」吗？\n兑换后余额：' +
    (DB.account.mainBalance - r.price) + ' 分' +
    (rHasLimit(r) ? '\n兑换额度的使用情况：' + rWindowLabel(r) + ' ' + rUsed(r) + '/' + rMax(r) : '') +
    extra, function(){ redeem(r); });

/* ---------- 家长端 · 数据看板 ---------- */
function rangeSum(days){
  var earn = 0, spend = 0;
  for(var i = 0; i < days; i++){
    var ds = dateStr(-i);
    DB.ledger.forEach(function(l){
      if(l.date !== ds) return;
      if(l.type === 'earn') earn += l.points;
      if(l.type === 'spend') spend -= l.points;
    });
  }
  return { earn:earn, spend:spend };
}
function doneRate(days){
  var rigid = activeTasks().filter(function(t){ return t.freq === 'daily'; });
  var total = 0, done = 0;
  for(var i = 0; i < days; i++){
    var ds = dateStr(-i);
    rigid.forEach(function(t){
      total++;
      if(DB.checkins.some(function(c){
        return c.taskId === t.id && c.date === ds && c.status !== 'rejected' && c.status !== 'revoked';
      })) done++;
    });
  }
  return total ? Math.round(done / total * 100) : 0;
}
function inflationReport(){
  var r14 = rangeSum(14);
  var cover = r14.spend > 0 ? r14.earn / r14.spend : (r14.earn > 0 ? 99 : 0);
  var dailySpend = r14.spend / 14;
  var runway = dailySpend > 0 ? Math.round(DB.account.mainBalance / dailySpend) : null;
  var avgTask = Math.round(activeTasks().reduce(function(s,t){ return s + t.points; }, 0) / Math.max(1, activeTasks().length));
  var flags = [];
  if(cover > 1.6) flags.push('近两周收入是支出的 ' + cover.toFixed(1) + ' 倍，积分在快速堆积');
  if(runway != null && runway > 60) flags.push('按当前花法，余额够用 ' + runway + ' 天，奖励显得太便宜');
  if(cover > 0 && cover < 0.6) flags.push('支出明显超过收入，可能定价过高，孩子会失去动力');
  return { cover:cover, runway:runway, avgTask:avgTask, flags:flags, r14:r14 };
}

/* ---------- 跨设备同步（同步码） ----------
   数据存在浏览器本地，天然无法跨设备。同步码把数据压缩成一串纯文本，
   可以复制、可以塞进链接，在另一台设备上粘贴即完成迁移。
   cfg  = 只带任务 / 商品 / 设置（不动对方的积分与记录）
   full = 全部数据（整体迁移）                                    */
var SYNC_TAG = 'GK';

function _b64urlEnc(bytes){
  var bin = '', CH = 0x8000;
  for(var i = 0; i < bytes.length; i += CH){
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
  }
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function _b64urlDec(str){
  var s = String(str).replace(/-/g, '+').replace(/_/g, '/');
  while(s.length % 4) s += '=';
  var bin = atob(s), out = new Uint8Array(bin.length);
  for(var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
function _canZip(){
  return typeof CompressionStream === 'function' && typeof DecompressionStream === 'function';
}
function _deflate(text){
  if(!_canZip()) return Promise.resolve(null);
  try{
    var cs = new CompressionStream('deflate-raw');
    var w = cs.writable.getWriter();
    w.write(new TextEncoder().encode(text));
    w.close();
    return new Response(cs.readable).arrayBuffer()
      .then(function(b){ return new Uint8Array(b); })
      .catch(function(){ return null; });
  }catch(e){ return Promise.resolve(null); }
}
function _inflate(bytes){
  var ds = new DecompressionStream('deflate-raw');
  var w = ds.writable.getWriter();
  w.write(bytes);
  w.close();
  return new Response(ds.readable).text();
}
function buildPayload(kind){
  if(kind === 'cfg') return { k:'cfg', t:DB.tasks, r:DB.rewards, c:DB.config };
  return { k:'full', d:DB };
}
function packCode(kind){
  var json = JSON.stringify(buildPayload(kind));
  return _deflate(json).then(function(bytes){
    if(bytes) return SYNC_TAG + '1:' + _b64urlEnc(bytes);
    return SYNC_TAG + '0:' + _b64urlEnc(new TextEncoder().encode(json));
  });
}
function extractCode(raw){
  var s = String(raw == null ? '' : raw);
  var i = s.indexOf('#sync=');
  if(i >= 0) s = s.slice(i + 6);
  s = s.replace(/\s+/g, '');
  var m = new RegExp('^' + SYNC_TAG + '([01]):([A-Za-z0-9\\-_]+)$').exec(s);
  if(!m) return null;
  return { zip: m[1] === '1', body: m[2] };
}
function unpackCode(raw){
  var c = extractCode(raw);
  if(!c) return Promise.reject(new Error('FORMAT'));
  var bytes;
  try{ bytes = _b64urlDec(c.body); }catch(e){ return Promise.reject(new Error('FORMAT')); }
  var p = c.zip ? _inflate(bytes) : Promise.resolve(new TextDecoder().decode(bytes));
  return p.then(function(txt){
    var obj = JSON.parse(txt);
    if(!obj) throw new Error('FORMAT');
    if(obj.k === 'cfg' && (!obj.t || !obj.r || !obj.c)) throw new Error('FORMAT');
    if(obj.k === 'full' && (!obj.d || !obj.d.account || !obj.d.config)) throw new Error('FORMAT');
    if(obj.k !== 'cfg' && obj.k !== 'full') throw new Error('FORMAT');
    return obj;
  });
}
function syncBaseUrl(){
  var p = location.pathname.replace(/\/(kid|parent)\/?$/, '/');
  if(p.charAt(p.length - 1) !== '/') p += '/';
  return location.origin + p;
}
function applySync(obj){
  if(obj.k === 'full'){
    DB = obj.d;
  } else {
    DB.tasks = obj.t;
    DB.rewards = obj.r;
    DB.config = obj.c;          /* PIN 一并同步，保证一家人一套设置 */
  }
  DB.meta = DB.meta || {};
  DB.meta.lastSyncAt = Date.now();
  saveDB();
  updateStreak();
  checkBadges();
  UI.parentUnlocked = false;
  UI.view = (APP_ROLE === 'parent') ? 'parent' : 'kid';
  render();
}
function copyText(txt, okMsg){
  function fallback(){
    var ta = document.createElement('textarea');
    ta.value = txt;
    ta.style.position = 'fixed'; ta.style.top = '0'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    var done = false;
    try{ done = document.execCommand('copy'); }catch(e){ done = false; }
    ta.remove();
    toast(done ? okMsg : '复制失败，请长按选中后手动复制', done ? 'ok' : 'warn');
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){ toast(okMsg, 'ok'); }, fallback);
  } else fallback();
}
function showSyncExport(kind){
  var isCfg = kind === 'cfg';
  packCode(kind).then(function(code){
    var link = syncBaseUrl() + '#sync=' + code.slice(SYNC_TAG.length);
    var kb = (code.length / 1024).toFixed(1);
    openModal(isCfg ? '同步设置' : '完整同步',

var CLOUD = {

function cloudLoadSDK(){

/* SDK 返回约定：getSession() → { data: session }，session = { accessToken, user:{id,raw} }。
   两个坑：① data 本身就是 session，没有 data.session 这层；
   ② session.user 里**没有 email**，邮箱要另外用 getUser() 取。 */
function pickSession(r){
  var d = r && r.data;
  if(!d) return null;
  return d.session ? d.session : d;
}
function sessionEmail(s){

function cloudFillProfile(){

function cloudBoot(){

/* ---- 拉取：云端 → 本地 ---- */
function cloudPull(){
  if(CS.state === 'off' || !CS.db || !CS.user) return Promise.resolve();
  return CS.db.from(CLOUD.table).select('id, rev, payload, updated_at').limit(1)
    .then(function(res){
      if(res.error) throw res.error;
      var rows = res.data || [];
      if(!rows.length){
        CS.rowId = null; CS.rev = 0;
        return cloudPush(true);
      }
      var row = rows[0];
      CS.rowId = row.id;
      if(row.rev === CS.rev) return;
      var first  = (CS.rev === 0);
      var remote = row.payload;
      if(remote && remote.account){
        if(first && localEmpty()) cloudAdopt(remote);
        else cloudMerge(remote, first);
      }
      CS.rev = row.rev;
      CS.lastAt = Date.now();
      CS.state = 'on';
      saveLocal();
      updateStreak(); checkBadges(); render();
      if(!first) toast('已同步另一台设备的改动', 'info');
    })
    .catch(function(e){
      CS.msg = (e && e.message) || '同步失败';
      CS.state = 'err';
      if(UI.view === 'parent') render();
    });
}
function cloudAdopt(remote){
  DB = remote;
  if(!DB.meta) DB.meta = {};
  migrateDB();
}
function cloudMerge(remote, quiet){
  if(!remote || !remote.account || !remote.config) return;
  var REC = ['checkins', 'orders', 'ledger', 'wishes', 'pledges'];
  var merged = JSON.parse(JSON.stringify(remote));
  REC.forEach(function(k){
    var seen = {}, arr = [];
    (remote[k] || []).concat(DB[k] || []).forEach(function(it){
      if(!it || !it.id || seen[it.id]) return;
      seen[it.id] = 1; arr.push(it);
    });
    arr.sort(function(a, b){ return (b.ts || 0) - (a.ts || 0); });
    if(k === 'ledger' && arr.length > 2000) arr.length = 2000;
    merged[k] = arr;
  });
  (merged.badges || []).forEach(function(b){
    var mine = (DB.badges || []).filter(function(x){ return x.id === b.id; })[0];
    if(mine && mine.achievedAt && !b.achievedAt) b.achievedAt = mine.achievedAt;
  });
  var extra = false;
  REC.forEach(function(k){
    var ids = {};
    (remote[k] || []).forEach(function(it){ if(it && it.id) ids[it.id] = 1; });
    (DB[k] || []).forEach(function(it){ if(it && it.id && !ids[it.id]) extra = true; });
  });
  if(extra){
    merged.account = JSON.parse(JSON.stringify(DB.account));
    merged.meta    = JSON.parse(JSON.stringify(DB.meta || merged.meta || {}));
    merged.flags   = JSON.parse(JSON.stringify(DB.flags || merged.flags || {}));
  }
  DB = merged;
  migrateDB();
  if(!quiet) toast('已合并两台设备的改动', 'info');
}

/* ---- 推送：本地 → 云端（本地改动后合并 0.7 秒推一次） ---- */
var _pushT = null;
function cloudQueue(){
  if(CS.state !== 'on' || !CS.db) return;
  if(_pushT) clearTimeout(_pushT);
  _pushT = setTimeout(function(){ cloudPush(false); }, 700);
}
function cloudPush(silent){
  if(CS.state === 'off' || !CS.db || !CS.user || CS.pushing) return Promise.resolve();
  CS.pushing = true;
  var payload = JSON.parse(JSON.stringify(DB));
  var q;
  if(CS.rowId == null){
    q = CS.db.from(CLOUD.table).insert({ payload: payload, rev: 1, updated_by: deviceTag() }).select();
  } else {
    q = CS.db.from(CLOUD.table).update({ payload: payload, rev: CS.rev + 1, updated_by: deviceTag() })
          .eq('id', CS.rowId).eq('rev', CS.rev).select();
  }
  return q.then(function(res){
    if(res.error) throw res.error;
    var rows = res.data || [];
    if(!rows.length) return cloudResync();
    CS.rowId  = rows[0].id;
    CS.rev    = rows[0].rev;
    CS.lastAt = Date.now();
    CS.state  = 'on';
    CS.msg    = '';
    _resyncDepth = 0;
    CS.pushing = false;
    if(!silent && UI.view === 'parent') render();
  }).catch(function(e){
    if(e && e.code === '23505'){
      CS.rowId = null; CS.rev = 0; CS.pushing = false;
      return cloudPull().then(function(){ cloudQueue(); });
    }
    CS.msg = (e && e.message) || '上传失败';
    CS.state = 'err';
    CS.pushing = false;
    /* 首次上传是静默发起的，但失败绝不能再静默：家长端要能立刻看到原因 */
    if(UI.view === 'parent') render();
  });
}
var _resyncDepth = 0;
function cloudResync(){
  CS.rev = 0;
  return CS.db.from(CLOUD.table).select('id, rev, payload').limit(1).then(function(r){
    var row = (r.data || [])[0];
    if(row){
      CS.rowId = row.id;
      if(row.payload && row.payload.account) cloudMerge(row.payload, true);
      CS.rev = row.rev;
      saveLocal(); render();
      CS.pushing = false;
      _resyncDepth = 0;
      cloudQueue();
      return;
    }
    /* 写进去却查不到：连续两次就判定为权限/登录问题，停止空转，把真实原因显示出来 */
    CS.pushing = false;
    _resyncDepth++;
    if(_resyncDepth >= 2){
      _resyncDepth = 0;
      CS.msg = '云端没有接受这次写入（可能登录状态失效，或数据表权限未生效）。';
      CS.state = 'err';
      if(UI.view === 'parent') render();
      return;
    }
    cloudQueue();
  }).catch(function(e){
    CS.pushing = false;
    CS.msg = (e && e.message) || '同步失败';
    CS.state = 'err';
    if(UI.view === 'parent') render();
  });
}

/* ---- 轮询 ---- */
function cloudTick(){
  if(CS.timer) return;
  CS.timer = setInterval(function(){
    if(document.hidden || CS.pushing || CS.state !== 'on') return;
    cloudPull();
  }, CLOUD.every);
  document.addEventListener('visibilitychange', function(){
    if(!document.hidden && CS.state === 'on') cloudPull();
  });
  window.addEventListener('online', function(){ if(CS.state === 'on') cloudPull(); });
}
function cloudNow(){
  if(CS.state !== 'on'){ toast('还没连上云端', 'warn'); return; }
  cloudPush(true).then(function(){ return cloudPull(); }).then(function(){
    toast('已是最新', 'ok');
  });
}

function authErr(e){
  var k = (e && e.kind) || '';
  if(k === 'invalid_grant' || /password|credential|invalid/i.test((e && e.message) || '')) return '邮箱或密码不对';
  if(k === 'network' || k === 'backend-unavailable') return '网络不稳定，稍后再试';
  return (e && e.message) || '操作失败';
}
function doSignIn(){
  var em = _v('#ac-em'), pw = _v('#ac-pw');
  if(!em || !pw){ toast('请填写邮箱和密码', 'warn'); return; }
  if(CS.busy) return;
  CS.busy = true; toast('正在登录…', 'info');
  CS.auth.signInWithPassword({ email: em, password: pw }).then(function(r){
    if(r.error) throw r.error;
    return afterLogin(pickSession(r));
  }).catch(function(e){
    toast(authErr(e), 'err');
  }).then(function(){ CS.busy = false; });
}
function doSendOtp(word){
  var em = _v('#ac-em');
  if(!em){ toast('请先填邮箱', 'warn'); return; }
  if(CS.busy) return;
  CS.busy = true; toast('正在发送…', 'info');
  CS.auth.sendOtp({ email: em }).then(function(r){
    if(r.error) throw r.error;
    CS.otpId    = r.data.verificationId;
    CS.otpExist = !!r.data.isExistingUser;
    toast('验证码已发出，请查看邮箱', 'ok');
  }).catch(function(e){
    toast(authErr(e), 'err');
  }).then(function(){ CS.busy = false; });
}
function doVerifyOtp(){
  var em = _v('#ac-em'), cd = _v('#ac-cd'), pw = _v('#ac-pw');
  if(!CS.otpId){ toast('请先点「发送验证码」', 'warn'); return; }
  if(!cd){ toast('请填验证码', 'warn'); return; }
  if(CS.busy) return;
  CS.busy = true;
  CS.auth.verifyOtp({
    verificationId: CS.otpId,
    token: cd,
    email: em,
    isExistingUser: CS.otpExist,
    password: CS.otpExist ? undefined : (pw || undefined)
  }).then(function(r){
    if(r.error) throw r.error;
    return afterLogin(pickSession(r));
  }).catch(function(e){
    toast(authErr(e), 'err');
  }).then(function(){ CS.busy = false; });
}
function doResetSend(){
  var em = _v('#ac-em');
  if(!em){ toast('请先填注册邮箱', 'warn'); return; }
  if(CS.busy) return;
  CS.busy = true; toast('正在发送…', 'info');

    if(r.error) throw r.error;
    CS.resetStart = r.data;

  }).catch(function(e){
    toast(authErr(e), 'err');
  }).then(function(){ CS.busy = false; });
}
function doReset(){
  var cd = _v('#ac-cd'), pw = _v('#ac-pw');
  if(!CS.resetStart){ toast('请先点「发送重置码」', 'warn'); return; }
  if(!cd || !pw){ toast('重置码和新密码都要填', 'warn'); return; }
  if(CS.busy) return;
  CS.busy = true;
  CS.resetStart.updateUser({ nonce: cd, password: pw }).then(function(done){
    if(done.error) throw done.error;
    return afterLogin(pickSession(done));
  }).catch(function(e){
    toast(authErr(e), 'err');
  }).then(function(){ CS.busy = false; });
}
function afterLogin(sess){
  return Promise.resolve().then(function(){
    if(sess && sess.user){
      CS.user  = sess.user;
      CS.email = sessionEmail(sess) || CS.email;
      return null;
    }
    return CS.auth.getSession().then(function(r){
      var s = pickSession(r);
      if(!s || !s.user) throw new Error('登录没有真正生效，请再试一次');
      CS.user  = s.user;
      CS.email = sessionEmail(s) || CS.email;
    });
  }).then(function(){
    CS.state = 'on';
    CS.rev = 0; CS.rowId = null;
    UI.gate = false;                     /* 登录成功 → 收起登录页，进应用 */
    return cloudPull();
  }).then(function(){
    cloudTick();
    cloudFillProfile();
    closeModal();
    if(CS.state === 'err') toast('已登录，但首次同步失败：' + (CS.msg || '未知原因'), 'err');
    else toast('云端同步已开启', 'ok');
    render();
    runPendingCheckin();                 /* 登录前点的那个打卡，接着完成 */
  });
}
function doSignOut(){
  CS.auth.signOut().then(function(){
    CS.user = null; CS.email = ''; CS.state = 'login';
    CS.rev = 0; CS.rowId = null;
    if(CS.timer){ clearInterval(CS.timer); CS.timer = null; }
    closeModal();
    /* 退出后回登录页：同步没开着就别接着记账了 */
    UI.gate = cloudEnvOK() ? 'login' : false;
    UI.syncAsked = false;
    toast('已退出，数据仍保留在本机', 'info');
    render();
  }).catch(function(e){ toast(authErr(e), 'err'); });
}

function download(filename, content, mime){
  var blob = new Blob([content], { type: mime || 'text/plain;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
}

function importJSON(input){
  var f = input.files && input.files[0];
  if(!f) return;
  var rd = new FileReader();
  rd.onload = function(e){
    try {
      var obj = JSON.parse(e.target.result);
      if(!obj || !obj.account || !obj.config) throw new Error('bad');
      DB = obj;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(DB));
      loadDB();
      toast('数据已恢复','ok');
      UI.parentUnlocked = false; render();
    } catch(err){ toast('文件格式不正确','err'); }
  };
  rd.readAsText(f);
  input.value = '';

function viewPinGate(){
  if(DB.config.parentPin === null || DB.config.parentPin === undefined){
    return '<div class="card padl tc">' +
      '<div style="display:flex;justify-content:center">' + starMascot(52) + '</div>' +
      '<div class="bd mt6 mb2">首次使用，先设置家长端 PIN</div>' +
      '<div class="xs mut mb16">4 位数字，用于保护审核与配置权限，孩子不会自己通过审核</div>' +
      '<input id="pin-new" type="tel" maxlength="4" inputmode="numeric" autofocus placeholder="输入 4 位数字" ' +
      'onkeydown="if(event.key===\'Enter\')setupPin()" ' +
      'style="text-align:center;font-size:24px;padding:14px;letter-spacing:10px">' +
      '<button class="btn pri wide mt12" onclick="setupPin()">设置并进入</button></div>';
  }
  return '<div class="card padl tc">' +
    '<div style="display:flex;justify-content:center">' + starMascot(52) + '</div>' +
    '<div class="bd mt6 mb2">家长端</div>' +
    '<div class="xs mut mb16">请输入 PIN 码</div>' +
    '<input id="pin-in" type="tel" maxlength="4" inputmode="numeric" autofocus placeholder="4 位数字" ' +
    'onkeydown="if(event.key===\'Enter\')tryPin()" ' +
    'style="text-align:center;font-size:24px;padding:14px;letter-spacing:10px">' +
    '<button class="btn pri wide mt12" onclick="tryPin()">进入</button></div>';
}
function setupPin(){
  var v = ($('#pin-new') || {}).value || '';
  if(!/^\d{4}$/.test(v)){ toast('请输入 4 位数字','warn'); return; }
  DB.config.parentPin = v; saveDB(); UI.parentUnlocked = true; render();
}
function tryPin(){
  var el = $('#pin-in');
  var v = el ? el.value : '';
  if(v === DB.config.parentPin){ UI.parentUnlocked = true; render(); return; }
  toast('PIN 码不正确','err');
  if(el){
    el.value = '';
    var card = el.parentNode;
    if(card){ card.classList.add('shake'); setTimeout(function(){ card.classList.remove('shake'); }, 420); }
  }
}

  }).join('') + '</div>';
}

function starMascot(size){
  var s = size || 36;
  return '<span class="mascot" style="width:' + s + 'px;height:' + s + 'px">' +
    '<img src="' + STAR_MASCOT_IMG + '" alt="星星人" style="width:100%;height:100%;object-fit:cover;border-radius:50%;display:block">' +
    '</span>';
}

function render(){
  var app = $('#app');
  if(!app) return;
  closeModal();

  /* 登录门：打开页面先过这一屏，确认云端同步真的开着 */
  if(UI.gate){
    app.innerHTML = viewGate();
    if(UI.gate === 'checking'){
      /* 检查超过 6 秒还没结果 → 给一条退路，免得卡在这屏出不去 */
      setTimeout(function(){
        var esc2 = $('#gt-esc');
        if(esc2 && UI.gate === 'checking') esc2.classList.remove('hide');
      }, 6000);
    } else {
      gateMount();
    }
    window.scrollTo(0, 0);
    return;
  }

  /* 家长端未解锁 → PIN 门 */
  if(UI.view === 'parent' && !UI.parentUnlocked){
    app.innerHTML = '<div class="wrap">' + viewPinGate() +
      '<div class="tc mt12"><button class="btn gh tiny" onclick="switchRole()">← 回到孩子端</button></div>' +
      '</div>';
    return;
  }

  var isKid = UI.view === 'kid';
  var btnLabel = isKid
    ? (APP_ROLE === 'parent' ? '返回家长端 🔒' : '家长端 🔒')
    : '孩子端 →';
  var roleBtn = (APP_ROLE === 'kid')
    ? '<button class="btn gh tiny" style="white-space:nowrap;flex:0 0 auto;padding:6px 10px" ' +
      'onclick="switchRole()" title="家长端（需要 PIN）">🔒</button>'
    : '<button class="btn gh tiny" style="white-space:nowrap;flex:0 0 auto" onclick="switchRole()">' +
      btnLabel + '</button>';
  var head = '<div class="row between mb12" style="padding:2px 4px;align-items:flex-start;gap:10px">' +
      '<div class="row g8" style="align-items:center;min-width:0">' + starMascot(isKid ? 40 : 34) +
      '<div style="min-width:0"><div class="bd lg">' +
        (isKid ? esc(DB.config.kidName || '宝贝') + '的成长工具箱' : '家长管理台') +
      '</div><div class="xs mut mt4">' + todayStr() +
        (isKid ? ' · 今天也一起摘星星呀' : ' · 审核 · 约定 · 看板 · 设置') + '</div></div></div>' +
      roleBtn + '</div>';

  var body, nav;
  if(isKid){
    body = UI.kidTab === 'shop'    ? viewKidShop() :
           UI.kidTab === 'account' ? viewKidAccount() :
           UI.kidTab === 'badges'  ? viewKidBadges()  : viewKidToday();
    nav = navBar(KID_TABS, UI.kidTab, 'kidTab');
  } else {
    body = UI.parentTab === 'trust'     ? viewParentTrust() :
           UI.parentTab === 'dashboard' ? viewParentDashboard() :
           UI.parentTab === 'config'    ? viewParentConfig()    : viewParentAudit();
    nav = navBar(PARENT_TABS, UI.parentTab, 'parentTab');
  }

  app.innerHTML = '<div class="wrap">' + head + body + '</div>' + nav;
}

/* ============================================================
   启动
   ============================================================ */
function boot(){
  loadDB();
  /* 按入口角色决定起始视图：家长端入口直接进 PIN 门，孩子端入口直接进打卡页 */
  if(APP_ROLE === 'parent'){ UI.view = 'parent'; UI.parentUnlocked = false; }
  else { UI.view = 'kid'; UI.kidTab = UI.kidTab || 'today'; }
  updateStreak();
  checkBadges();
  /* 打开先过登录门：能同步的地址先查登录状态，不能同步的地址直接说明原因 */
  UI.gate = cloudEnvOK() ? 'checking' : 'envoff';
  render();
  // 首次使用提示（家长端入口不提示，孩子端入口也不提示，交给家长端链接）
  if(!DB.config.parentPin && APP_ROLE === 'both'){
    setTimeout(function(){ toast('第一次用？先点右上角「家长端」设个 PIN 码','info'); }, 900);
  }
  /* 链接里带了同步码 → 引导导入（放在最后，等页面渲染完再弹） */
  checkSyncHash();
  /* 连接云端（未登录 / 非发布地址会自动退回纯本地，不打断使用） */
  cloudBoot();
}
if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}
</script>
